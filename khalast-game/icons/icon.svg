<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.6" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="190" fill="url(#glowGrad)" />

  <!-- Outer Wheel Rim -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#goldGrad)" stroke-width="18" />
  <circle cx="256" cy="256" r="148" fill="none" stroke="#fef08a" stroke-width="3" opacity="0.9" />

  <!-- Wheel Studs -->
  <circle cx="256" cy="96" r="8" fill="#fef08a" />
  <circle cx="256" cy="416" r="8" fill="#fef08a" />
  <circle cx="96" cy="256" r="8" fill="#fef08a" />
  <circle cx="416" cy="256" r="8" fill="#fef08a" />
  <circle cx="143" cy="143" r="8" fill="#fef08a" />
  <circle cx="369" cy="143" r="8" fill="#fef08a" />
  <circle cx="143" cy="369" r="8" fill="#fef08a" />
  <circle cx="369" cy="369" r="8" fill="#fef08a" />

  <!-- Center Hub -->
  <circle cx="256" cy="256" r="115" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="8" />

  <!-- Center Letter / Emblem (خ) -->
  <text x="256" y="275" font-family="'Cairo', sans-serif" font-size="130" font-weight="900" fill="#ffffff" text-anchor="middle" filter="url(#dropGlow)">خَ</text>

  <!-- Top Pointer Arrow -->
  <polygon points="256,60 274,105 238,105" fill="#ef4444" stroke="#fef08a" stroke-width="3" />
  <circle cx="256" cy="100" r="5" fill="#ffffff" />
</svg>
